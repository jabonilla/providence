[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "providence"
version = "0.1.0"
description = "AI-Native Hedge Fund - Autonomous Investment System"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "structlog>=23.0",
    "httpx>=0.24",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
]

[project.scripts]
providence = "providence.__main__:main"

[tool.ruff]
# The codebase is written to roughly 100 columns (p99 line length is 93),
# so 100 keeps the formatter from rewrapping ~576 otherwise-fine lines.
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Ruff's default rule set, stated explicitly so a new ruff release cannot
# silently widen what CI enforces.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Re-exports are the point of a package __init__.
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["providence*"]
