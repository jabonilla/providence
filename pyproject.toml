[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "providence"
version = "0.1.0"
description = "AI-Native Hedge Fund - Autonomous Investment System"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "structlog>=23.0",
    "httpx>=0.24",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    # Required by the UploadFile routes in api/routes/{documents,chat}.py.
    # Present in requirements.txt but missing here, so `pip install -e .`
    # produced an app that could not be imported.
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
]

[project.scripts]
providence = "providence.__main__:main"

[tool.ruff]
# The codebase is written to roughly 100 columns (p99 line length is 93),
# so 100 keeps the formatter from rewrapping ~576 otherwise-fine lines.
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Ruff's default rule set, stated explicitly so a new ruff release cannot
# silently widen what CI enforces.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Re-exports are the point of a package __init__.
"__init__.py" = ["F401"]
# load_dotenv() must run before the providence imports, since config modules
# read the environment at import time.
"providence/__main__.py" = ["E402"]
# pytest.importorskip("fastapi") has to precede the fastapi imports it guards.
"tests/unit/api/conftest.py" = ["E402"]
"tests/unit/api/test_shadow.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["providence*"]
