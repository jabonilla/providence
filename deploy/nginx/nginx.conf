worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Security: hide nginx version
    server_tokens off;

    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10m;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';
    access_log /var/log/nginx/access.log main;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=pipeline:10m rate=2r/m;

    # Upstream API server
    upstream providence_api {
        server api:8000;
        keepalive 32;
    }

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl http2;
        server_name _;

        # TLS — replace with your certs
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Health probes (no rate limit, no auth)
        location = /api/v1/health/live {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://providence_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location = /api/v1/health/ready {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://providence_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Pipeline trigger endpoints (strict rate limit)
        location ~ ^/api/v1/pipeline/run {
            limit_req zone=pipeline burst=2 nodelay;
            proxy_pass http://providence_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;  # Pipeline runs can be slow
        }

        # All other API endpoints
        location /api/v1/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://providence_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # OpenAPI docs
        location /docs {
            limit_req zone=api burst=5 nodelay;
            proxy_pass http://providence_api;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            limit_req zone=api burst=5 nodelay;
            proxy_pass http://providence_api;
            proxy_set_header Host $host;
        }

        # Root
        location = / {
            proxy_pass http://providence_api;
            proxy_set_header Host $host;
        }

        # Block everything else
        location / {
            return 404;
        }
    }
}
