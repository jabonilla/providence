name: Providence CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ── Lint ─────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: pip install ruff
      - name: Check formatting
        run: ruff format --check providence/ tests/
      - name: Check linting
        run: ruff check providence/ tests/

  # ── Unit Tests ───────────────────────────────────────────────────
  test-unit:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run unit tests
        run: |
          python -m pytest tests/unit/ \
            -v --tb=short \
            --cov=providence --cov-report=xml \
            --junitxml=test-results.xml
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ── Integration Tests ────────────────────────────────────────────
  test-integration:
    runs-on: ubuntu-latest
    needs: test-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run integration tests
        run: |
          python -m pytest tests/integration/ \
            -v --tb=short \
            --timeout=120
        env:
          PROVIDENCE_SKIP_PERCEPTION: "true"

  # ── Docker Build ─────────────────────────────────────────────────
  docker:
    runs-on: ubuntu-latest
    needs: [test-unit]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build --target api -t providence-api:${{ github.sha }} .
      - name: Build runner image
        run: docker build --target runner -t providence-runner:${{ github.sha }} .
      - name: Verify API health
        run: |
          docker run -d --name test-api \
            -p 8000:8000 \
            -e ANTHROPIC_API_KEY=test \
            providence-api:${{ github.sha }} \
            --skip-perception --skip-adaptive
          sleep 5
          curl -f http://localhost:8000/api/v1/health/live || exit 1
          docker stop test-api

  # ── Deploy (main branch only) ────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Login to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push images
        run: |
          REGISTRY=${{ vars.REGISTRY_URL }}/providence
          TAG=${{ github.sha }}

          docker build --target api -t $REGISTRY/api:$TAG -t $REGISTRY/api:latest .
          docker build --target runner -t $REGISTRY/runner:$TAG -t $REGISTRY/runner:latest .

          docker push $REGISTRY/api:$TAG
          docker push $REGISTRY/api:latest
          docker push $REGISTRY/runner:$TAG
          docker push $REGISTRY/runner:latest

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/providence
            docker compose pull
            docker compose up -d api runner
            sleep 10
            curl -f http://localhost:8000/api/v1/health/ready || exit 1
            echo "Deploy successful: ${{ github.sha }}"
